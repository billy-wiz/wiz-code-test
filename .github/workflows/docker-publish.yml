name: Build and Push Container Image

on:
  push:
    branches: [ "main" ]
    # Build & publish tagged releases
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build, Test & Publish Tagged Releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Runs 'npm ci' to install root build tools (Gulp), 
      # then 'gulp build' generates /dist and installs runtime dependencies inside /dist
      - name: Install dependencies, run unit tests & Gulp build
        run: |
          npm ci
          node --test
          npx gulp build

      # Uses GitHub's automatic GITHUB_TOKEN to authenticate with ghcr.io
      - name: Log into GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract metadata for Docker
        if: github.ref_type == 'tag'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            
      - name: Build and push Docker image
        if: github.ref_type == 'tag'
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./dist
          file: ./dist/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
