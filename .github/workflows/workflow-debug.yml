name: workflow debug

# Manual-only trigger; the workflow will not run automatically.
on:
  workflow_dispatch:
#   workflow_run:
#     workflows: ["Build and Push Container Image"]
#     types:
#       - completed

jobs:
  dump-event:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Logging
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_EVENT_PATH=$GITHUB_EVENT_PATH"
          echo "APP_NAME=${{ vars.APP_NAME }}"
      - name: Show full event payload
        run: |
          echo "==== GITHUB EVENT ===="
          jq . "$GITHUB_EVENT_PATH" || cat "$GITHUB_EVENT_PATH"